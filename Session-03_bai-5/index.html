<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 10px;
    }
  </style>
</head>

<body>
  <h1>Tạo table dơn giản</h1>

  <table>
    <thead>
      <tr>
        <th>Tháng</th>
        <th colspan="2">Tỷ lệ đơn hàng theo tháng</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Tháng 1</td>
        <td>15% hoàn thành</td>
        <td>55% hủy hàng</td>
      </tr>
      <tr>
        <td>Tháng 2</td>
        <td>25% hoàn thành</td>
        <td>75% hủy hàng</td>
      </tr>
      <tr>
        <td>Tháng 3</td>
        <td>50% hoàn thành</td>
        <td>50% hủy hàng</td>
      </tr>

    </tbody>
  </table>
</body>

</html>
