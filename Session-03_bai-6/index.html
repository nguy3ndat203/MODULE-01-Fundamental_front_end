<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 10px;
    }
  </style>
</head>

<body>
  <h1>Tạo table sử dụng thuộc tính rowspan</h1>

  <table>
    <thead>
      <tr>
        <th>Loại sản phẩm</th>
        <th>Tên sản phẩm</th>
        <th>Giá sản phẩm</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="2">Điện tử</td>
        <td>Laptop</td>
        <td>15.000.000đ</td>
      </tr>
      <tr>
        <td>Điện thoại</td>
        <td>8.000.000đ</td>
      </tr>
      <tr>
        <td>Gia dụng</td>
        <td>Tủ lạnh</td>
        <td>5.000.000đ</td>
      </tr>

    </tbody>
  </table>
</body>

</html>
