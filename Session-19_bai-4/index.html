<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Người Dùng - CSS Thuần</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <!-- Form Thêm Người Dùng -->
    <div class="card card-form">
      <h3>Thêm người dùng mới</h3>
      <form id="addUserForm">
        <div class="form-group">
          <label>Họ và tên</label>
          <input type="text" id="addName" placeholder="Nhập họ và tên..." required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="addEmail" placeholder="Nhập địa chỉ email..." required>
        </div>
        <button type="submit" class="btn btn-primary">Thêm vào bảng</button>
      </form>
    </div>

    <!-- Bảng Danh Sách -->
    <div class="card card-table">
      <h3>Danh sách người dùng</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th style="width: 10%">STT</th>
              <th style="width: 35%">Họ và tên</th>
              <th style="width: 35%">Email</th>
              <th style="width: 20%" class="text-center">Hành động</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- JS render dữ liệu -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Chỉnh Sửa-->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h4>Cập nhật thông tin</h4>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editUserForm">
          <!-- Thẻ input ẩn lưu vị trí (index) user đang sửa -->
          <input type="hidden" id="editIndex">
          <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" id="editName" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="editEmail" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
        <button type="button" class="btn btn-warning" onclick="saveUpdate()">Lưu thay đổi</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>

</html>
