<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
    }
  </style>
</head>

<body>
  <h1>Tạo table dơn giản</h1>

  <table>
    <thead>
      <tr>
        <th>Tên</th>
        <th>Tuổi</th>
        <th>Nghề nghiệp</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Nguyễn Văn An</td>
        <td>25</td>
        <td>Lập trình viên</td>
      </tr>
      <tr>
        <td>Trần Bảo</td>
        <td>30</td>
        <td>Kỹ sư xây dựng</td>
      </tr>
      <tr>
        <td>Lê Chi</td>
        <td>22</td>
        <td>Sinh viên</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
